services:
  - type: web
    name: tripcanvas-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://tripcanvas-shitu-melody.yuchangceng065.chatgpt.site,https://yuchangceng065-hub.github.io
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
