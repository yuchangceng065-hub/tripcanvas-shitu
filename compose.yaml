services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripcanvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tripcanvas
    volumes:
      - tripcanvas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripcanvas"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tripcanvas:${POSTGRES_PASSWORD}@database:5432/tripcanvas
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
    depends_on:
      database:
        condition: service_healthy
volumes:
  tripcanvas-data:
